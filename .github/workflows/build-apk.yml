name: Build & Release Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release (tag: v1.0.0-debug)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Build Environment
        run: |
          chmod +x gradlew
          # Ensure .env exists for Secrets Gradle Plugin
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          # Ensure debug.keystore is present for debugConfig signing
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p output-apk
          cp app/build/outputs/apk/debug/app-debug.apk output-apk/Awaaz-AI-Assistant-debug.apk
          echo "Debug APK prepared successfully at output-apk/Awaaz-AI-Assistant-debug.apk"
          ls -lh output-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Awaaz-AI-Assistant-Debug-APK
          path: output-apk/Awaaz-AI-Assistant-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (On Tag or Manual Trigger)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/Awaaz-AI-Assistant-debug.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0-debug' }}
          name: "Awaaz AI Assistant ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0-debug' }}"
          draft: false
          prerelease: false
          body: |
            ### 📱 Awaaz AI Voice Assistant - Debug APK
            
            **Installation Instructions for Android:**
            1. Download `Awaaz-AI-Assistant-debug.apk` onto your Android phone.
            2. Open the downloaded file from your Downloads folder or notification bar.
            3. When prompted, allow **"Install from unknown sources"** for your browser / file manager.
            4. Tap **Install** and open the app.
            5. Grant **Microphone** and **Notification** permissions when prompted.
            6. Set your custom assistant name (e.g. *Jarvis*, *दोस्त*) and tap **"शुरू करें (Activate)"**!
          token: ${{ secrets.GITHUB_TOKEN }}
